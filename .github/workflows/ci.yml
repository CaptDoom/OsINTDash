name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt --break-system-packages

      - name: Run backend tests
        env:
          TESTING: "1"
          NEWS_API_KEY: "test-key"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python -m pytest backend/tests/ -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npx vite build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt --break-system-packages

      - name: Run security module tests
        env:
          TESTING: "1"
        run: |
          python -c "
          from backend.app.services.net_safety import is_safe_url, sanitize_filename
          from backend.app.services.credibility import compute_source_reputation_score
          from backend.app.services.circuit_breaker import CircuitBreaker
          from backend.app.services.rate_limiter import SlidingWindowRateLimiter

          # SSRF: block private/loopback
          assert is_safe_url('http://127.0.0.1/admin') == False
          assert is_safe_url('http://169.254.169.254/') == False
          assert is_safe_url('http://10.0.0.1/') == False
          assert is_safe_url('https://reuters.com') == True

          # Path traversal
          assert sanitize_filename('../../../etc/shadow') == 'shadow'
          assert sanitize_filename('a/b/c.pdf') == 'c.pdf'

          # Source reputation
          assert compute_source_reputation_score('reuters.com') == 1.0
          assert compute_source_reputation_score('bbc.com') == 0.85

          # Circuit breaker state machine
          cb = CircuitBreaker('test', failure_threshold=2, cooldown_seconds=1)
          assert cb.can_execute() == True
          cb.record_failure()
          cb.record_failure()
          assert cb.can_execute() == False

          print('All security tests passed!')
          "
