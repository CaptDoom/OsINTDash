services:
  - type: web_service
    name: drishya-web
    env: docker
    branch: main
    dockerfilePath: Dockerfile.backend
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: drishya-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: drishya-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        value: ""
      - key: GOOGLE_API_KEY
        value: ""
      - key: NEWSAPI_KEY
        value: ""
      - key: WORLD_NEWS_API_KEY
        value: ""
      - key: NEWSDATA_API_KEY
        value: ""
      - key: FINNHUB_API_KEY
        value: ""
      - key: GNEWS_API_KEY
        value: ""
      - key: CURRENTS_API_KEY
        value: ""
      - key: THENEWS_API_KEY
        value: ""
      - key: MEDIASTACK_API_KEY
        value: ""
      - key: NEWSCATCHER_API_KEY
        value: ""
      - key: BING_NEWS_API_KEY
        value: ""
      - key: OLLAMA_BASE_URL
        value: ""
      - key: LLM_PROVIDER
        value: ""
      - key: LLM_MODEL
        value: ""
      - key: S3_BUCKET_NAME
        value: drishya-uploads

  - type: redis
    name: drishya-redis
    plan: free
    ipAllowList: []

databases:
  - name: drishya-db
    databaseName: drishya
    user: drishya_user
    plan: free
