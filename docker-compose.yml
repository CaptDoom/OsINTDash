version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: drishya-postgres
    environment:
      POSTGRES_USER: drishya_user
      POSTGRES_PASSWORD: drishya_password
      POSTGRES_DB: drishya_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishya_user -d drishya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: drishya-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
