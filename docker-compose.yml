services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: drishya-postgres
    environment:
      POSTGRES_USER: drishya_user
      POSTGRES_PASSWORD: drishya_password
      POSTGRES_DB: drishya_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishya_user -d drishya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: drishya-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: drishya-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://drishya_user:drishya_password@postgres:5432/drishya_db
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      ENABLE_DEMO_SEED_DATA: ${ENABLE_DEMO_SEED_DATA:-false}
      ENABLE_PERIODIC_INGESTION: ${ENABLE_PERIODIC_INGESTION:-true}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWSDATA_API_KEY: ${NEWSDATA_API_KEY:-}
      NEWSCATCHER_API_KEY: ${NEWSCATCHER_API_KEY:-}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      WORLD_NEWS_API_KEY: ${WORLD_NEWS_API_KEY:-}
      CURRENTS_API_KEY: ${CURRENTS_API_KEY:-}
      THENEWS_API_KEY: ${THENEWS_API_KEY:-}
      MEDIASTACK_API_KEY: ${MEDIASTACK_API_KEY:-}
      BING_NEWS_API_KEY: ${BING_NEWS_API_KEY:-}
      FREENEWSAPI_KEY: ${FREENEWSAPI_KEY:-}
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: drishya-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
